name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package SERVER (base principal)
        run: npm run dist -- --win --publish never

      - name: Package CLIENT (Acceso)
        run: npm run dist:client -- --win --publish never

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist-client/*.exe
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    # Runs after the Windows job so the release already exists; this job just
    # attaches the Android APK to it.
    needs: build-windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from the SDK repo and breaks
          # the default install; only platform-tools is needed here.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + sync Capacitor
        run: npm run android:sync

      - name: Build Acceso APK (debug)
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FacturacionAcceso-${{ github.ref_name }}.apk

      - name: Add APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FacturacionAcceso-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
